server:
  port: ${PORT:${SERVER_PORT:8086}}

spring:
  application:
    name: candidatura
  # banco PRÓPRIO deste microsserviço (MongoDB Atlas): candidaturas e seus status
  mongodb:
    uri: ${MONGO_URI}
    auto-index-creation: true   # cria o índice único (usuario + vagaId)
  rabbitmq:
    host: ${RABBITMQ_HOST:jaragua.lmq.cloudamqp.com}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USER:bxvkfpaf}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:bxvkfpaf}
    ssl:
      enabled: true
    listener:
      simple:
        default-requeue-rejected: false

event:
  candidatura-criada:
    exchange: ex-candidatura-criada
    queue: candidatura-criada
  candidatura-resultado:
    exchange: ex-candidatura-resultado
    queue: candidatura-resultado

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %msg%n"
  level:
    com.fatec: INFO
